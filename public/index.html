<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Czat</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; background:#f4f4f4; }
  #box { background:#fff; border:1px solid #ccc; border-radius:6px; padding:10px; height:400px; overflow-y:auto; }
  .msg { margin-bottom:6px; }
  .nick { font-weight:bold; color:#2a5db0; }
  .time { color:#999; font-size:11px; margin-left:6px; }
  #form { display:flex; margin-top:10px; gap:6px; }
  #nick { width:120px; }
  #text { flex:1; }
  input, button { padding:8px; }
  #shutdownWrap { margin-top:16px; text-align:right; }
  #shutdownBtn { background:#c0392b; color:#fff; border:none; border-radius:4px; cursor:pointer; }
</style>
</head>
<body>

<h2>Czat</h2>
<div id="box"></div>

<div id="form">
  <input id="nick" placeholder="nick" maxlength="30">
  <input id="text" placeholder="wiadomość" maxlength="500">
  <button id="send">Wyślij</button>
</div>

<div id="shutdownWrap">
  <button id="shutdownBtn">Awaryjny shutdown</button>
</div>

<script>
// Adres backendu API. Jesli strona jest hostowana osobno (np. GitHub Pages),
// front-end i backend nie sa na tym samym originie, wiec trzeba podac adres
// backendu recznie (zapamietywany w localStorage). Jesli strone serwuje
// bezposrednio server.js (Render, localhost), sciezki wzgledne dzialaja same.
const SERVER_URL = (function () {
  if (location.hostname.endsWith('github.io')) {
    let url = localStorage.getItem('chatServerUrl');
    if (!url) {
      url = prompt('Adres backendu czatu (np. https://twoja-nazwa.onrender.com):') || '';
      url = url.trim().replace(/\/+$/, '');
      if (url) localStorage.setItem('chatServerUrl', url);
    }
    return url;
  }
  return '';
})();
function api(path) { return SERVER_URL + path; }

let lastId = 0;
const box = document.getElementById('box');

function renderMessage(m) {
  const div = document.createElement('div');
  div.className = 'msg';
  const t = new Date(m.time).toLocaleTimeString();
  div.innerHTML = '<span class="nick">' + escapeHtml(m.nick) + ':</span> '
                 + escapeHtml(m.text)
                 + '<span class="time">' + t + '</span>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

async function loadHistory() {
  try {
    const res = await fetch(api('/api/messages?after=' + lastId));
    const data = await res.json();
    data.forEach(m => { renderMessage(m); lastId = m.id; });
  } catch (e) {
    // cichy błąd sieci
  }
}

// WebSocket - natychmiastowy odbior nowych wiadomosci, bez odpytywania co X sekund.
// Jesli polaczenie padnie (np. serwer usnal na Render), proba ponownego polaczenia
// co 3s, a w miedzyczasie polling co 5s jako zapasowa sciezka.
let ws = null;
let wsConnected = false;
let fallbackPoll = null;

function wsUrl() {
  const base = SERVER_URL || location.origin;
  return base.replace(/^http/, 'ws') + '/ws';
}

function connectWs() {
  try {
    ws = new WebSocket(wsUrl());
  } catch (e) {
    scheduleReconnect();
    return;
  }
  ws.onopen = () => {
    wsConnected = true;
    if (fallbackPoll) { clearInterval(fallbackPoll); fallbackPoll = null; }
  };
  ws.onmessage = (event) => {
    try {
      const m = JSON.parse(event.data);
      if (m.id > lastId) { renderMessage(m); lastId = m.id; }
    } catch (e) {}
  };
  ws.onclose = () => {
    wsConnected = false;
    if (!fallbackPoll) fallbackPoll = setInterval(loadHistory, 5000);
    scheduleReconnect();
  };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}

function scheduleReconnect() {
  setTimeout(connectWs, 3000);
}

async function send() {
  const nick = document.getElementById('nick').value || 'anonim';
  const text = document.getElementById('text').value;
  if (!text.trim()) return;
  await fetch(api('/api/messages'), {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ nick, text })
  });
  document.getElementById('text').value = '';
}

document.getElementById('send').addEventListener('click', send);
document.getElementById('text').addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});

loadHistory().then(connectWs);

async function shutdown() {
  if (!confirm('Na pewno awaryjnie wyłączyć serwer?')) return;
  const key = prompt('Klucz wyłączenia:');
  if (!key) return;
  try {
    const res = await fetch(api('/api/shutdown'), {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ key })
    });
    if (res.ok) {
      alert('Serwer wyłączony.');
    } else {
      const data = await res.json();
      alert('Błąd: ' + (data.error || res.status));
    }
  } catch (e) {
    alert('Serwer nie odpowiada (prawdopodobnie już wyłączony).');
  }
}

document.getElementById('shutdownBtn').addEventListener('click', shutdown);
</script>

</body>
</html>
