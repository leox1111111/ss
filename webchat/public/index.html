<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Czat</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; background:#f4f4f4; }
  #box { background:#fff; border:1px solid #ccc; border-radius:6px; padding:10px; height:400px; overflow-y:auto; }
  .msg { margin-bottom:6px; }
  .nick { font-weight:bold; color:#2a5db0; }
  .time { color:#999; font-size:11px; margin-left:6px; }
  #form { display:flex; margin-top:10px; gap:6px; }
  #nick { width:120px; }
  #text { flex:1; }
  input, button { padding:8px; }
  #shutdownWrap { margin-top:16px; text-align:right; }
  #shutdownBtn { background:#c0392b; color:#fff; border:none; border-radius:4px; cursor:pointer; }
  #wallpaperWrap { margin-top:16px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  #wallpaperUrl { flex:1; min-width:150px; }
  #fakelockWrap { margin-top:8px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  #fakelockText { flex:1; min-width:150px; }
  #fakelockBtn { background:#2c3e50; color:#fff; border:none; border-radius:4px; cursor:pointer; padding:8px; }

  #fakelockOverlay {
    display:none;
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:linear-gradient(160deg,#0f2027,#203a43,#2c5364);
    color:#fff; z-index:9999;
    flex-direction:column; align-items:center; justify-content:center;
    font-family:Arial, sans-serif; text-align:center; cursor:pointer;
    user-select:none;
  }
  #fakelockClock { font-size:64px; font-weight:300; }
  #fakelockDate { font-size:18px; opacity:0.8; margin-top:4px; }
  #fakelockMsg { margin-top:40px; font-size:20px; }
  #fakelockHint { margin-top:12px; font-size:13px; opacity:0.6; }
  #fakelockIcon { font-size:40px; margin-bottom:10px; }
</style>
</head>
<body>

<h2>Czat</h2>
<div id="box"></div>

<div id="form">
  <input id="nick" placeholder="nick" maxlength="30">
  <input id="text" placeholder="wiadomość" maxlength="500">
  <button id="send">Wyślij</button>
</div>

<div id="shutdownWrap">
  <button id="shutdownBtn">Awaryjny shutdown</button>
</div>

<div id="wallpaperWrap">
  <input id="wallpaperColor" type="color" value="#f4f4f4">
  <input id="wallpaperUrl" placeholder="albo wklej link do obrazka (http...)">
  <button id="wallpaperBtn">Zmień tapetę</button>
</div>

<div id="fakelockWrap">
  <input id="fakelockText" placeholder="tekst na blokadzie (opcjonalnie)" maxlength="100">
  <button id="fakelockBtn">Aktywuj fakelock (wszystkim)</button>
</div>

<div id="fakelockOverlay">
  <div id="fakelockIcon">🔒</div>
  <div id="fakelockClock">--:--</div>
  <div id="fakelockDate"></div>
  <div id="fakelockMsg"></div>
  <div id="fakelockHint">kliknij, żeby odblokować</div>
</div>

<script>
// Adres backendu API. Jesli strona jest hostowana osobno (np. GitHub Pages),
// front-end i backend nie sa na tym samym originie, wiec trzeba podac adres
// backendu recznie (zapamietywany w localStorage). Jesli strone serwuje
// bezposrednio server.js (Render, localhost), sciezki wzgledne dzialaja same.
const SERVER_URL = (function () {
  if (location.hostname.endsWith('github.io')) {
    let url = localStorage.getItem('chatServerUrl');
    if (!url) {
      url = prompt('Adres backendu czatu (np. https://twoja-nazwa.onrender.com):') || '';
      url = url.trim().replace(/\/+$/, '');
      if (url) localStorage.setItem('chatServerUrl', url);
    }
    return url;
  }
  return '';
})();
function api(path) { return SERVER_URL + path; }

let lastId = 0;
const box = document.getElementById('box');

function renderMessage(m) {
  const div = document.createElement('div');
  div.className = 'msg';
  const t = new Date(m.time).toLocaleTimeString();
  div.innerHTML = '<span class="nick">' + escapeHtml(m.nick) + ':</span> '
                 + escapeHtml(m.text)
                 + '<span class="time">' + t + '</span>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

async function poll() {
  try {
    const res = await fetch(api('/api/messages?after=' + lastId));
    const data = await res.json();
    data.forEach(m => { renderMessage(m); lastId = m.id; });
  } catch (e) {
    // cichy błąd sieci - spróbujemy ponownie przy kolejnym pollu
  }
}

async function send() {
  const nick = document.getElementById('nick').value || 'anonim';
  const text = document.getElementById('text').value;
  if (!text.trim()) return;
  await fetch(api('/api/messages'), {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ nick, text })
  });
  document.getElementById('text').value = '';
}

document.getElementById('send').addEventListener('click', send);
document.getElementById('text').addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});

poll();
setInterval(poll, 2000);

async function shutdown() {
  if (!confirm('Na pewno awaryjnie wyłączyć serwer?')) return;
  const key = prompt('Klucz wyłączenia:');
  if (!key) return;
  try {
    const res = await fetch(api('/api/shutdown'), {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ key })
    });
    if (res.ok) {
      alert('Serwer wyłączony.');
    } else {
      const data = await res.json();
      alert('Błąd: ' + (data.error || res.status));
    }
  } catch (e) {
    alert('Serwer nie odpowiada (prawdopodobnie już wyłączony).');
  }
}

document.getElementById('shutdownBtn').addEventListener('click', shutdown);

function applyWallpaper(w) {
  if (!w || !w.value) return;
  if (w.type === 'image') {
    document.body.style.backgroundImage = 'url(' + JSON.stringify(w.value).slice(1, -1) + ')';
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    document.body.style.backgroundRepeat = 'no-repeat';
    document.body.style.backgroundAttachment = 'fixed';
  } else {
    document.body.style.backgroundImage = 'none';
    document.body.style.backgroundColor = w.value;
  }
}

async function pollWallpaper() {
  try {
    const res = await fetch(api('/api/wallpaper'));
    const w = await res.json();
    applyWallpaper(w);
    if (w.type === 'color') document.getElementById('wallpaperColor').value = w.value;
  } catch (e) {
    // cichy błąd
  }
}

async function setWallpaper() {
  const url = document.getElementById('wallpaperUrl').value.trim();
  const color = document.getElementById('wallpaperColor').value;
  const body = url ? { type: 'image', value: url } : { type: 'color', value: color };

  const res = await fetch(api('/api/wallpaper'), {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  if (res.ok) {
    const w = await res.json();
    applyWallpaper(w);
    document.getElementById('wallpaperUrl').value = '';
  } else {
    const data = await res.json();
    alert('Błąd: ' + (data.error || res.status));
  }
}

document.getElementById('wallpaperBtn').addEventListener('click', setWallpaper);

pollWallpaper();
setInterval(pollWallpaper, 5000);

// --- Fakelock (prank) ---
const overlay = document.getElementById('fakelockOverlay');
let fakelockActive = false;
let dismissedLocally = false; // odblokowanie lokalne, dopóki serwer nie zmieni stanu z powrotem

function updateClock() {
  const now = new Date();
  document.getElementById('fakelockClock').textContent =
    now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  document.getElementById('fakelockDate').textContent =
    now.toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });
}
setInterval(updateClock, 1000);
updateClock();

async function pollFakelock() {
  try {
    const res = await fetch(api('/api/fakelock'));
    const st = await res.json();
    fakelockActive = !!st.active;
    if (fakelockActive && !dismissedLocally) {
      document.getElementById('fakelockMsg').textContent = st.text || '';
      overlay.style.display = 'flex';
    } else {
      overlay.style.display = 'none';
    }
  } catch (e) {
    // cichy błąd
  }
}

overlay.addEventListener('click', () => {
  // czysto kosmetyczne odblokowanie — nic realnie nie blokowało
  dismissedLocally = true;
  overlay.style.display = 'none';
});

async function toggleFakelock() {
  const text = document.getElementById('fakelockText').value.trim();
  const nextActive = !fakelockActive;
  await fetch(api('/api/fakelock'), {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ active: nextActive, text })
  });
  dismissedLocally = false;
  pollFakelock();
  document.getElementById('fakelockBtn').textContent =
    nextActive ? 'Wyłącz fakelock (wszystkim)' : 'Aktywuj fakelock (wszystkim)';
}

document.getElementById('fakelockBtn').addEventListener('click', toggleFakelock);

pollFakelock();
setInterval(pollFakelock, 2000);
</script>

</body>
</html>
